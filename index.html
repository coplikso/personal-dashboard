<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="lowgow.png">
    <title>ken dashh</title>
</head>
<body>
    <h2>Hello!, welcome to the dashboard!👋</h2>

    

    <!-- mac dock -->
    <div class="dock">
        <div class="dock-item" title="github" onclick="togglegithub()">
            <img src="github.png" alt="github dashboard" class="dock-icon">
            <span class="dock-label">GitHub dashboard</span>
            <div class="dock-dot" id="github-dot"></div>
        </div>
        <div class="dock-item" title="Mymusic" onclick="togglemymusic()">
            <img src="music.png" alt="Mymusic" class="dock-icon">
            <span class="dock-label">music</span>
            <div class="dock-dot" id="Mymusic-dot"></div>
        </div>
        <div class="dock-item" title="photo dump" onclick="togglemymusic()">
            <img src="photos.png" alt="photo dump" class="dock-icon">
            <span class="dock-label">photo dump</span>
            <div class="dock-dot" id="photo-dot"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
